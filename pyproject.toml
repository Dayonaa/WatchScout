[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "watch-dealer-rag"
version = "1.0.1"
description = "Fast CPU-based Watch Dealer NER and RAG Search Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "spacy>=3.8.0",
    "duckdb>=1.0.0",
    "fastembed>=0.8.0",
    "pydantic>=2.0.0",
    "tqdm>=4.66.0",
]

[project.scripts]
watch-search = "app:main"
watch-train = "src.trainer:main"
watch-stream = "stream_simulator:main"
